<text x="430.0" y="288" font-size="14" font-weight="400" fill="#374151" text-anchor="middle">matches GuardDuty</text>
<text x="430.0" y="309" font-size="14" font-weight="400" fill="#374151" text-anchor="middle">findings</text>
