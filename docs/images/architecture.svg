<text x="612" y="255" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">1  Allowlist + sanitise fields</text>
<text x="612" y="282" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">2  Hardened, delimited prompt</text>
<text x="612" y="309" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">3  Guardrail check (via Bedrock)</text>
<text x="612" y="336" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">4  Strict output validation</text>
<text x="612" y="363" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">5  Severity = GuardDuty band</text>
<text x="612" y="390" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">6  Escape output for Slack</text>
